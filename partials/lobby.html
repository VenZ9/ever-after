<section class="screen" id="screen-lobby">
  <div class="lobby-card card">
    <h2>Share this room</h2>
    <p class="muted small" style="margin:0 0 4px;">Scan the QR code, or read them the 6‑word code.</p>
    <div class="qr-wrap" id="qrWrap"></div>
    <div class="code-display" id="codeDisplay"></div>
    <div class="link-row">
      <input class="link-input" id="roomLink" readonly />
      <button class="btn btn-ghost" id="copyLinkBtn" style="padding:13px 18px;font-size:13px;">Copy link</button>
    </div>
    <div class="waiting-row" id="lobbyWaiting">
      <span class="spinner"></span> Waiting for your partner to join...
    </div>
  </div>
</section>
