<section class="celebration" id="celebration" hidden>
  <canvas id="confetti"></canvas>
  <div class="celebration-inner">
    <svg class="rings" viewBox="0 0 220 130" fill="none">
      <circle class="ring-a" cx="86" cy="75" r="48" stroke="var(--accent)" stroke-width="10"/>
      <circle class="ring-b" cx="134" cy="75" r="48" stroke="var(--accent)" stroke-width="10" opacity=".5"/>
      <path d="M110 18l5.4 13.4L129 37l-13.6 5.6L110 56l-5.4-13.4L91 37l13.6-5.6z" fill="var(--gold)"/>
    </svg>
    <h1>You are married!</h1>
    <p class="celeb-sub">Two hearts, one promise — forever.</p>
    <div class="cert">
      <div class="cert-names" id="certNames">
        <span id="nameA">Partner A</span>
        <span class="cert-amp">+</span>
        <span id="nameB">Partner B</span>
      </div>
      <div class="cert-meta" id="certMeta"></div>
    </div>
  </div>
</section>
