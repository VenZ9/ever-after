<section class="screen" id="screen-form">
  <div class="workspace">

    <div class="col-left">
      <div class="card form-card">
        <div class="card-head">
          <h2>Your details</h2>
          <span class="pill" id="myProgress">0 / 6</span>
        </div>

        <div class="field">
          <label class="field-label" for="nameInput">Name</label>
          <input id="nameInput" class="text-input" type="text" placeholder="Type your full name"
                 maxlength="40" autocomplete="off" spellcheck="false" />
        </div>

        <div class="field">
          <div class="field-label">Sign</div>
          <div class="sign-box" id="signBox">
            <canvas id="signCanvas"></canvas>
            <span class="sign-ph">Sign here</span>
            <button class="mini-icon-btn" id="clearSign" type="button" aria-label="Clear signature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field-row">
          <div class="field" style="margin-bottom:0;">
            <div class="field-label">Fingerprint</div>
            <div class="fingerprint-box" id="fpBox">
              <div class="fp-rings"><span></span><span></span><span></span></div>
              <div class="fp-icon" id="fpIcon"></div>
              <div class="fp-text" id="fpText">Put your finger here</div>
              <button class="fp-reset" id="fpReset" type="button" aria-label="Reset fingerprint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                  <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field field-grow" style="margin-bottom:0;">
            <div class="field-label">Date</div>
            <div class="pick-box" id="dateBox">
              <svg class="pick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/>
              </svg>
              <span class="pick-value" id="dateValue">Select date</span>
              <input type="date" id="dateInput" class="pick-input" />
            </div>

            <div class="field-label mt">Time</div>
            <div class="pick-box" id="timeBox">
              <svg class="pick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 1.9"/>
              </svg>
              <span class="pick-value" id="timeValue">Select time</span>
              <input type="time" id="timeInput" class="pick-input" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-right">
      <div class="card hand-card">
        <div class="card-head"><h2>Bracelet</h2></div>
        <p class="muted small" style="margin:0;">Drag the bracelet onto the wrist to seal your promise.</p>
        <div class="stage" id="stage">
          <svg class="hand-svg" viewBox="0 0 200 250" fill="none">
            <rect class="hand-part" x="72" y="158" width="56" height="84" rx="26"/>
            <rect class="hand-part" x="46" y="44" width="24" height="78" rx="12"/>
            <rect class="hand-part" x="73" y="28" width="24" height="94" rx="12"/>
            <rect class="hand-part" x="100" y="38" width="24" height="84" rx="12"/>
            <rect class="hand-part" x="127" y="58" width="22" height="64" rx="11"/>
            <rect class="hand-part" x="16" y="90" width="26" height="62" rx="13" transform="rotate(-28 29 121)"/>
            <rect class="hand-part" x="42" y="92" width="112" height="92" rx="34"/>
          </svg>
          <div class="bracelet" id="bracelet">
            <svg viewBox="0 0 100 60">
              <ellipse cx="50" cy="32" rx="38" ry="17" fill="none" stroke="var(--accent)" stroke-width="13"/>
              <ellipse cx="50" cy="32" rx="38" ry="17" fill="none" stroke="var(--accent-dark)" stroke-width="3.5" stroke-dasharray="4 7" opacity=".55"/>
              <path class="gem" d="M50 6.5 57.5 15 50 23.5 42.5 15Z" fill="var(--gold)" style="transform-box:fill-box;transform-origin:center"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="card partner-card">
        <div class="card-head">
          <h2>Partner</h2>
          <span class="dot" id="peerDot"></span>
        </div>
        <p class="status" id="peerStatus">Connecting to your partner...</p>
        <div class="peer-progress">
          <div class="bar"><div class="bar-fill" id="peerBarFill" style="width:0%;"></div></div>
          <span class="pill" id="peerProgressPill">—</span>
        </div>
      </div>
    </div>

  </div>
        </section>
